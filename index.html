<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seerah of the Prophet and Islam | Learning Adventure</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58CC02">
<meta name="description" content="An interactive Islamic learning app for beginners about the life of Prophet Muhammad ﷺ, Islam and its teachings and the companions. Features bilingual (English/Arabic) lessons, quizzes, achievements, and progress tracking. Designed for kids and new learners.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seerah Islam">
<link rel="apple-touch-icon" href="seerah-logo.png">
<link rel="icon" type="image/png" href="seerah-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
:root{
  --green:#58CC02;
  --green-dark:#3F9A01;
  --green-light:#89E219;
  --blue:#1CB0F6;
  --blue-dark:#1294D4;
  --blue-light:#5CC6F9;
  --orange:#FF9600;
  --orange-dark:#E08500;
  --orange-light:#FFB84D;
  --purple:#CE82FF;
  --purple-dark:#A855E8;
  --red:#FF4B4B;
  --red-dark:#E03030;
  --pink:#FF82C8;
  --white:#FFFFFF;
  --bg:#E8F5E0;
  --bg-card:#FFFFFF;
  --text:#2B2B2B;
  --text-light:#777777;
  --text-muted:#AAAAAA;
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:16px;
  --radius-sm:12px;
  --radius-xl:24px;
  --nav-height:64px;
}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;overflow:hidden;
}
#app{
  width:100%;max-width:480px;height:100vh;max-height:860px;
  position:relative;overflow:hidden;
  background:var(--bg);
  box-shadow:0 0 60px rgba(0,0,0,0.08);
  display:flex;flex-direction:column;
}
@media(min-width:481px){
  #app{border-radius:32px;height:90vh;margin:20px auto}
}

/* SCREENS */
.screen{display:flex;flex-direction:column;height:100%;width:100%;position:absolute;top:0;left:0;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px) scale(0.98);transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1),transform 0.4s cubic-bezier(0.16,1,0.3,1),visibility 0.4s cubic-bezier(0.16,1,0.3,1)}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);transition:opacity 0.4s cubic-bezier(0.16,1,0.3,1),transform 0.4s cubic-bezier(0.16,1,0.3,1),visibility 0.4s cubic-bezier(0.16,1,0.3,1)}
.screen-content{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none;-ms-overflow-style:none}
.screen-content::-webkit-scrollbar{display:none}
.screen-content.extra-pad{padding-bottom:calc(var(--nav-height) + 16px)}

/* BOTTOM NAV */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;height:var(--nav-height);
  background:var(--white);border-top:1px solid rgba(0,0,0,0.06);
  display:flex;align-items:center;justify-content:space-around;
  z-index:50;flex-shrink:0;
  box-shadow:0 -2px 12px rgba(0,0,0,0.04);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 16px;border:none;background:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;
  color:var(--text-light);transition:color 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;
}
.nav-item.active{color:var(--green)}
.nav-item.active::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--green);border-radius:0 0 4px 4px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1)}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:11px}

/* HEADER */
.header{
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:relative;z-index:10;
}
.header-title{font-size:17px;font-weight:900;color:var(--text);letter-spacing:-0.3px}
.header-back{
  width:40px;height:40px;border-radius:50%;border:none;
  background:var(--white);box-shadow:var(--shadow);
  cursor:pointer;font-size:18px;color:var(--text);
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.header-back:hover{transform:scale(1.06);box-shadow:var(--shadow-lg)}
.header-spacer{width:40px}
.header-btn{
  background:var(--white);border:none;border-radius:20px;padding:8px 14px;
  font-size:13px;font-weight:800;color:var(--text);cursor:pointer;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;
  font-family:'Nunito',sans-serif;transition:all 0.2s;
}
.header-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}

/* HOME SCREEN */
#screen-home{align-items:center;text-align:center;padding:20px 20px 80px;overflow-y:auto;scrollbar-width:none}
#screen-home::-webkit-scrollbar{display:none}
.home-top-row{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:320px;margin-bottom:12px;
}
.home-stat{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:var(--text)}
.home-stat-icon{font-size:20px}
.home-mascot{
  width:200px;height:200px;margin-bottom:20px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.home-logo-img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
}
.home-calligraphy{
  position:relative;width:130px;height:120px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#1A2540 0%,#0E1628 100%);
  border-radius:50%;border:2px solid rgba(180,160,120,0.3);box-shadow:0 0 30px rgba(180,160,120,0.1);
}
.home-calligraphy .cal-border{position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(180,160,120,0.15);pointer-events:none}
.home-calligraphy .cal-border2{position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(180,160,120,0.1);pointer-events:none}
.home-calligraphy .cal-text{
  font-family:'Traditional Arabic','Scheherazade New','Arabic Typesetting',serif;
  font-size:42px;color:#D4B86A;text-align:center;line-height:1.1;letter-spacing:2px;
  text-shadow:0 0 20px rgba(212,184,106,0.3),0 0 40px rgba(212,184,106,0.1);
  transform:translateY(-2px);cursor:pointer;
}
.home-calligraphy .cal-sword{position:absolute;font-size:20px;color:rgba(180,160,120,0.15);top:12px;right:18px;transform:rotate(15deg)}
.home-calligraphy .cal-moon{position:absolute;font-size:9px;top:8px;left:16px;opacity:0.3;filter:grayscale(1)}
.home-calligraphy .cal-star{position:absolute;font-size:5px;opacity:0;animation:calStar 2.5s ease-in-out infinite}
@keyframes calStar{0%,100%{opacity:0;transform:scale(0.3)}50%{opacity:0.7;transform:scale(1)}}
.home-calligraphy .cal-ornament{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(180,160,120,0.2);letter-spacing:6px}
@keyframes salawatFloat{0%{transform:translateY(0) scale(0.5);opacity:1}30%{opacity:1}100%{transform:translateY(-200px) scale(1.3);opacity:0}}
.home-title{
  font-family:'Fredoka One',cursive;
  font-size:26px;color:var(--text);line-height:1.2;margin-bottom:2px;
}
.home-sub{
  font-size:14px;color:var(--text-light);margin-bottom:16px;
}
.reset-btn{background:none;border:none;font-size:11px;color:var(--text-muted);cursor:pointer;padding:8px;margin-top:4px;transition:color 0.2s;font-family:'Nunito',sans-serif}
.reset-btn:hover{color:var(--red)}
.home-streak-bar{
  display:flex;align-items:center;gap:16px;
  background:var(--white);border-radius:var(--radius);
  padding:12px 20px;box-shadow:var(--shadow);margin-bottom:16px;width:100%;max-width:320px;
}
.streak-item{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text)}
.streak-item .num{font-size:18px;font-weight:900}
.streak-divider{width:1px;height:28px;background:#e0e0e0}

/* LEVELS */
.level-grid{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.level-card{
  background:var(--white);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;transition:all 0.25s;
  box-shadow:var(--shadow);border:3px solid transparent;
  display:flex;align-items:center;gap:14px;
}
.level-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--green-light)}
.level-card.locked{opacity:0.5;cursor:not-allowed}
.level-card.locked:hover{transform:none;box-shadow:var(--shadow);border-color:transparent}
.level-card.completed{border-color:var(--green);background:linear-gradient(135deg,#F0FFF0,var(--white))}
.level-card.current{border-color:var(--blue);background:linear-gradient(135deg,#EEF9FF,var(--white))}
.level-icon{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-light),var(--green));
}
.level-info{flex:1;min-width:0}
.level-name{font-size:15px;font-weight:800;color:var(--text)}
.level-desc{font-size:11px;color:var(--text-light);margin-top:1px}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen active">
    <div class="screen-content">
      <div class="home-top-row">
        <div class="home-stat"><span class="home-stat-icon">⭐</span><span>Level 1</span></div>
        <div class="home-stat"><span class="home-stat-icon">🔥</span><span>0 Streak</span></div>
      </div>
      <div class="home-mascot">
        <img src="seerah-logo.png" alt="Seerah Islam Logo" class="home-logo-img">
      </div>
      <h1 class="home-title">Seerah & Islam</h1>
      <p class="home-sub">Learn about the Prophet and Islam</p>
      <button class="reset-btn">Reset Progress</button>
      <div class="home-streak-bar">
        <div class="streak-item"><span class="home-stat-icon">📚</span><span class="num">0</span> Lessons</div>
        <div class="streak-divider"></div>
        <div class="streak-item"><span class="home-stat-icon">✅</span><span class="num">0</span> Completed</div>
      </div>
      <div class="level-grid">
        <div class="level-card">
          <div class="level-icon">📖</div>
          <div class="level-info">
            <div class="level-name">Lesson 1</div>
            <div class="level-desc">Start your journey</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </button>
    <button class="nav-item">
      <div class="nav-icon">📖</div>
      <div class="nav-label">Learn</div>
    </button>
    <button class="nav-item">
      <div class="nav-icon">🏆</div>
      <div class="nav-label">Rewards</div>
    </button>
    <button class="nav-item">
      <div class="nav-icon">⚙️</div>
      <div class="nav-label">Settings</div>
    </button>
  </nav>
</div>

<script>
// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(registration => {
      console.log('Service Worker registered successfully:', registration);
    })
    .catch(error => {
      console.log('Service Worker registration failed:', error);
    });
}

// Install app prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('Install prompt is ready');
});

// Handle app installed
window.addEventListener('appinstalled', () => {
  console.log('App was installed');
  deferredPrompt = null;
});
</script>
</body>
</html>
